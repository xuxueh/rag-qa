<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 智能知识库问答</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px 16px; }
        h1 { text-align: center; color: #1f2937; margin-bottom: 6px; font-size: 28px; }
        .subtitle { text-align: center; color: #6b7280; margin-bottom: 24px; font-size: 14px; }
        .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .example-btn { background: #fff; border: 1px solid #d1d5db; border-radius: 20px; padding: 6px 14px;
                       cursor: pointer; font-size: 13px; color: #374151; transition: all .2s; }
        .example-btn:hover { background: #2563eb; color: #fff; border-color: #2563eb; }
        .chat-box { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06);
                    padding: 24px; min-height: 200px; max-height: 55vh; overflow-y: auto; margin-bottom: 16px; }
        .msg { margin-bottom: 16px; }
        .msg .role { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .msg .bubble { padding: 12px 16px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; font-size: 15px; }
        .msg.user .bubble { background: #2563eb; color: #fff; }
        .msg.assistant .bubble { background: #f3f4f6; color: #1f2937; }
        .sources { margin-top: 8px; font-size: 12px; }
        .sources summary { color: #2563eb; cursor: pointer; }
        .source-item { background: #eff6ff; border-radius: 6px; padding: 8px; margin-top: 6px; color: #475569; }
        .source-item .fn { color: #2563eb; font-weight: bold; }
        .input-row { display: flex; gap: 10px; }
        #question { flex: 1; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 10px;
                    font-size: 15px; outline: none; }
        #question:focus { border-color: #2563eb; }
        #send { padding: 12px 24px; background: #2563eb; color: #fff; border: none; border-radius: 10px;
                font-size: 15px; cursor: pointer; }
        #send:hover { background: #1d4ed8; }
        #send:disabled { background: #93c5fd; cursor: not-allowed; }
        .loading { color: #2563eb; font-size: 14px; padding: 12px; }
        /* 知识库管理面板 */
        .kb-panel { background: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
                    box-shadow: 0 1px 6px rgba(0,0,0,.05); font-size: 14px; }
        .kb-panel summary { cursor: pointer; color: #374151; font-weight: bold; }
        .kb-body { margin-top: 12px; }
        .kb-upload { display: flex; gap: 8px; margin-bottom: 8px; }
        .kb-upload input[type=file] { flex: 1; font-size: 13px; }
        .kb-btn { padding: 6px 14px; background: #2563eb; color: #fff; border: none;
                  border-radius: 6px; cursor: pointer; font-size: 13px; }
        .kb-btn:hover { background: #1d4ed8; }
        .kb-status { font-size: 13px; color: #2563eb; margin-bottom: 8px; min-height: 18px; }
        .kb-list { list-style: none; max-height: 160px; overflow-y: auto; }
        .kb-list li { display: flex; justify-content: space-between; align-items: center;
                      padding: 5px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; color: #4b5563; }
        .kb-del { color: #dc2626; cursor: pointer; border: none; background: none; font-size: 13px; }
        .kb-del:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 智能知识库问答</h1>
        <p class="subtitle">混合检索 + Rerank + DeepSeek · 答案有据可查</p>

        <details class="kb-panel">
            <summary>📁 知识库管理（上传 / 删除文档）</summary>
            <div class="kb-body">
                <div class="kb-upload">
                    <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx">
                    <button class="kb-btn" onclick="uploadDoc()">上传</button>
                </div>
                <div id="kbStatus" class="kb-status"></div>
                <ul id="kbList" class="kb-list"></ul>
            </div>
        </details>

        <div class="examples">
            <button class="example-btn" onclick="ask('报销金额超过5000元需要谁审批？')">报销审批</button>
            <button class="example-btn" onclick="ask('员工迟到超过30分钟怎么处理？')">迟到处理</button>
            <button class="example-btn" onclick="ask('婚假有几天？')">婚假天数</button>
            <button class="example-btn" onclick="ask('公司附近有什么好吃的餐厅？')">防幻觉测试</button>
        </div>

        <div class="chat-box" id="chat"></div>

        <div class="input-row">
            <input id="question" type="text" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')ask()">
            <button id="send" onclick="ask()">发送</button>
        </div>
    </div>

    <script>
        // ─── 知识库管理 ───
        async function loadDocs() {
            try {
                const resp = await fetch('/documents');
                const data = await resp.json();
                const list = document.getElementById('kbList');
                list.innerHTML = '';
                data.documents.forEach(name => {
                    const li = document.createElement('li');
                    li.innerHTML = '<span>' + escapeHtml(name) + '</span>' +
                        '<button class="kb-del" onclick="deleteDoc(\'' + name.replace(/'/g, "\\'") + '\')">删除</button>';
                    list.appendChild(li);
                });
                document.getElementById('kbStatus').textContent = '共 ' + data.count + ' 份文档';
            } catch (e) {
                document.getElementById('kbStatus').textContent = '加载失败：' + e.message;
            }
        }

        async function uploadDoc() {
            const input = document.getElementById('fileInput');
            const status = document.getElementById('kbStatus');
            if (!input.files.length) { status.textContent = '请先选择文件'; return; }
            const fd = new FormData();
            fd.append('file', input.files[0]);
            status.textContent = '上传中（会触发检索器重建，约 1-2 分钟）...';
            try {
                const resp = await fetch('/documents/upload', { method: 'POST', body: fd });
                const data = await resp.json();
                if (resp.ok) {
                    status.textContent = '✅ 已上传：' + data.uploaded + '（检索器已重建）';
                    input.value = '';
                    loadDocs();
                } else {
                    status.textContent = '❌ 上传失败：' + (data.detail || JSON.stringify(data));
                }
            } catch (e) {
                status.textContent = '❌ 上传失败：' + e.message;
            }
        }

        async function deleteDoc(name) {
            const status = document.getElementById('kbStatus');
            if (!confirm('确定删除 ' + name + ' ？（会触发检索器重建）')) return;
            status.textContent = '删除中（重建检索器约 1-2 分钟）...';
            try {
                const resp = await fetch('/documents/' + encodeURIComponent(name), { method: 'DELETE' });
                const data = await resp.json();
                if (resp.ok) {
                    status.textContent = '✅ 已删除：' + data.deleted;
                    loadDocs();
                } else {
                    status.textContent = '❌ 删除失败：' + (data.detail || JSON.stringify(data));
                }
            } catch (e) {
                status.textContent = '❌ 删除失败：' + e.message;
            }
        }

        window.addEventListener('DOMContentLoaded', loadDocs);

        function addMsg(role, html) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = '<div class="role">' + (role === 'user' ? '🙋 你' : '🤖 AI') + '</div><div class="bubble">' + html + '</div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function ask(example) {
            const input = document.getElementById('question');
            const q = (example || input.value).trim();
            if (!q) return;
            input.value = '';
            addMsg('user', escapeHtml(q));
            const loading = addMsg('assistant', '<span class="loading">🤔 思考中（首次约 30 秒加载模型）...</span>');

            const sendBtn = document.getElementById('send');
            sendBtn.disabled = true;
            try {
                const resp = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q })
                });
                const data = await resp.json();
                let html = '<span class="loading">❌ 请求失败</span>';
                if (resp.ok) {
                    html = escapeHtml(data.answer);
                    if (data.sources && data.sources.length) {
                        html += '<div class="sources"><details><summary>📄 引用来源（' + data.sources.length + '）</summary>';
                        data.sources.forEach((s, i) => {
                            html += '<div class="source-item"><span class="fn">来源：' + escapeHtml(s.source) + '</span><br>' +
                                    escapeHtml(s.text.length > 120 ? s.text.slice(0, 120) + '...' : s.text) + '</div>';
                        });
                        html += '</details></div>';
                    }
                } else {
                    html = '<span style="color:#dc2626">' + escapeHtml(data.detail || JSON.stringify(data)) + '</span>';
                }
                loading.querySelector('.bubble').innerHTML = html;
            } catch (e) {
                loading.querySelector('.bubble').innerHTML = '<span style="color:#dc2626">请求失败：' + escapeHtml(e.message) + '</span>';
            }
            sendBtn.disabled = false;
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
